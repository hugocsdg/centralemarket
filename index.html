<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-mark.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CentraleMarket — Your campus. Your marketplace.</title>
    <meta name="description" content="Buy, sell and discover great deals from fellow CentraleSupélec students." />
    <meta name="theme-color" content="#09090B" />
    <!-- App instalable en el móvil ("Añadir a pantalla de inicio"): nombre, icono y pantalla completa -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CentraleMarket" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Vista previa al compartir el enlace (WhatsApp, Instagram, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CentraleMarket" />
    <meta property="og:title" content="CentraleMarket — Your campus. Your marketplace." />
    <meta property="og:description" content="Buy, sell and discover great deals from fellow CentraleSupélec students." />
    <meta property="og:url" content="https://centralemarket.vercel.app/" />
    <meta property="og:image" content="https://centralemarket.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CentraleMarket logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Modo claro (Profile → Appearance): se aplica antes de pintar nada, así no hay parpadeo oscuro.
         Misma lógica que src/lib/theme.ts. La intro (/welcome) siempre va en oscuro. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('cm-theme')
          var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          if (light && location.pathname !== '/welcome') {
            document.documentElement.dataset.theme = 'light'
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F5F4F2')
          }
        } catch (e) {}
      })()
    </script>
    <!-- En la intro (sin sesión), pedir la imagen de la portada cuanto antes: es lo primero que se ve -->
    <script>
      ;(function () {
        var path = location.pathname
        if (path !== '/welcome' && path !== '/') return
        try {
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.*-auth-token$/.test(localStorage.key(i) || '') && path === '/') return
          }
        } catch (e) {}
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.fetchPriority = 'high'
        link.setAttribute('imagesrcset', matchMedia('(max-width: 720px)').matches
          ? '/intro/campus-night-mobile.webp'
          : '/intro/campus-night-1280.webp 1280w, /intro/campus-night-1920.webp 1920w')
        link.setAttribute('imagesizes', '100vw')
        document.head.appendChild(link)
      })()
    </script>
    <!-- Pantalla de carga: se ve AL INSTANTE (no espera al código de la app). React usa la misma
         (components/Splash.tsx) mientras comprueba la sesión y descarga la página, así no hay saltos. -->
    <style>
      html,
      body {
        background: #09090b;
      }
      .cm-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(60vmax 60vmax at 50% 42%, rgb(224 21 63 / 0.1), transparent 60%), #09090b;
        font-family: 'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .cm-splash-logo {
        position: relative;
        width: 112px;
        animation: cm-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .cm-splash-logo::before {
        content: '';
        position: absolute;
        inset: -40%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(224 21 63 / 0.45), transparent);
        animation: cm-breathe 2.4s ease-in-out infinite;
      }
      .cm-splash-logo img {
        position: relative;
        display: block;
        width: 100%;
        height: auto;
      }
      .cm-splash-name {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #fff;
        animation: cm-rise 0.7s 0.08s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .cm-splash-name span {
        color: #e0153f;
      }
      .cm-splash-tagline {
        margin: -14px 0 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: rgb(255 255 255 / 0.65);
        animation: cm-rise 0.7s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .cm-splash-bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.1);
        animation: cm-rise 0.7s 0.16s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .cm-splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #e0153f, #ff3b62);
        animation: cm-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .cm-splash-continue .cm-splash-logo,
      .cm-splash-continue .cm-splash-name,
      .cm-splash-continue .cm-splash-tagline,
      .cm-splash-continue .cm-splash-bar {
        animation-name: none;
      }
      @keyframes cm-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes cm-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
      @keyframes cm-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      /* Pantalla de carga en modo claro */
      [data-theme='light'],
      [data-theme='light'] body {
        background: #f5f4f2;
      }
      [data-theme='light'] .cm-splash {
        background: radial-gradient(60vmax 60vmax at 50% 42%, rgb(224 21 63 / 0.08), transparent 60%), #f5f4f2;
      }
      [data-theme='light'] .cm-splash-name {
        color: #111114;
      }
      [data-theme='light'] .cm-splash-tagline {
        color: rgb(17 17 20 / 0.65);
      }
      [data-theme='light'] .cm-splash-bar {
        background: rgb(17 17 20 / 0.1);
      }
      @media (prefers-reduced-motion: reduce) {
        .cm-splash *,
        .cm-splash *::before,
        .cm-splash *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="cm-splash" role="status" aria-label="Loading CentraleMarket">
        <div class="cm-splash-logo"><img src="/logo-mark.webp" alt="" width="360" height="202" /></div>
        <p class="cm-splash-name">Centrale<span>Market</span></p>
        <p class="cm-splash-tagline">Your campus. Your marketplace.</p>
        <div class="cm-splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
